<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图生图长 · 本地图片库</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./gallery.css" />
  </head>
  <body>
    <div class="gallery-shell">
      <header class="gallery-hero panel">
        <div class="hero-main">
          <p class="eyebrow">Local Gallery</p>
          <h1>本地图片库</h1>
          <p class="hero-text">这里汇总图生图长 · AI创作台的历史生成结果，按时间倒序展示。图片和记录都来自当前浏览器本地缓存或本地服务端索引。</p>
        </div>
        <aside class="hero-meta">
          <div class="hero-actions">
            <a class="nav-link" href="./index.html">返回创作台</a>
            <a class="nav-link" href="./prompts.html">提示词库</a>
            <button class="ghost-button" id="refresh-gallery" type="button">刷新画廊</button>
          </div>
          <dl class="hero-stats">
            <div class="hero-stat-item">
              <dt class="stat-label">生成记录</dt>
              <dd class="hero-stat-value" id="record-count">0</dd>
            </div>
            <div class="hero-stat-item">
              <dt class="stat-label">图片总数</dt>
              <dd class="hero-stat-value" id="image-count">0</dd>
            </div>
            <div class="hero-stat-item hero-stat-wide">
              <dt class="stat-label">最近生成</dt>
              <dd class="hero-stat-value" id="latest-time">-</dd>
            </div>
          </dl>
        </aside>
      </header>

      <section class="toolbar-grid">
        <section class="sym-panel gallery-toolbar panel">
          <header class="sym-panel-head">
            <p class="eyebrow">Filter</p>
            <h2>按比例筛选</h2>
          </header>
          <div class="sym-panel-body">
            <select id="gallery-filter" class="select-input sym-control"></select>
            <span class="selection-summary sym-summary" id="selection-summary">未选中记录</span>
            <div class="sym-actions">
              <button class="ghost-button" id="select-visible-records" type="button">选中当前筛选</button>
              <button class="ghost-button" id="clear-selection" type="button">清空选择</button>
              <button class="ghost-button" id="delete-selected-records" type="button">批量删除</button>
              <button class="ghost-button" id="export-pdf-selected" type="button" disabled>导出已选为 PDF</button>
            </div>
          </div>
        </section>

        <section class="sym-panel pdf-upload-panel panel">
          <input type="file" id="pdf-upload-input" accept="image/*" multiple hidden />
          <header class="sym-panel-head">
            <p class="eyebrow">Image to PDF</p>
            <h2>上传图片转 PDF</h2>
          </header>
          <div class="sym-panel-body">
            <p class="hero-text sym-desc">上传本地图片（支持单张或批量），点击导出即可将全部图片合并为一个 PDF，文件名自动带上当天日期。</p>
            <div class="sym-actions">
              <button class="ghost-button" id="pdf-upload-trigger" type="button">选择图片</button>
              <button class="ghost-button" id="pdf-export-btn" type="button" disabled>导出为 PDF</button>
              <button class="ghost-button" id="pdf-clear-btn" type="button" disabled>清空</button>
              <span class="sym-actions-spacer" aria-hidden="true"></span>
            </div>
            <div class="pdf-upload-thumbs" id="pdf-upload-thumbs"></div>
          </div>
        </section>
      </section>

      <main class="masonry" id="masonry"></main>
    </div>

    <div class="lightbox" id="gallery-lightbox" hidden>
      <div class="lightbox-backdrop" data-lightbox-close="true"></div>
      <div class="lightbox-dialog panel" role="dialog" aria-modal="true" aria-label="图片放大预览">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">关闭</button>
        <img class="lightbox-image" id="lightbox-image" alt="" />
        <p class="lightbox-caption" id="lightbox-caption"></p>
      </div>
    </div>

    <template id="gallery-card-template">
      <article class="gallery-card panel">
        <img class="gallery-image" />
        <div class="gallery-body">
          <div class="gallery-meta-row">
            <span class="meta-pill ratio-pill"></span>
            <span class="meta-pill style-pill"></span>
            <label class="record-pick">
              <input class="record-select" type="checkbox" />
              <span>选中</span>
            </label>
          </div>
          <div class="gallery-prompt-block">
            <p class="gallery-title"></p>
            <button class="prompt-toggle" type="button" hidden>展开</button>
          </div>
          <p class="gallery-time"></p>
          <div class="gallery-actions">
            <button class="ghost-button copy-prompt-button" type="button">复制提示词</button>
            <a class="download-link" target="_blank" rel="noreferrer">下载</a>
            <button class="ghost-button export-pdf-button" type="button">导出为 PDF</button>
            <button class="ghost-button delete-record-button" type="button">删除记录</button>
          </div>
        </div>
      </article>
    </template>

    <script src="./gallery.js"></script>
  </body>
</html>
