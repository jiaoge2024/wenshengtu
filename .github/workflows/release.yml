# GitHub Actions workflow: 自动创建 Release 并上传源码压缩包
# 触发条件：推送以 v 或 V 开头的 tag（如 v1.0.3、V1.0.3）

name: Auto Release

# 仅在推送 tag 时触发
on:
  push:
    tags:
      - 'v*'
      - 'V*'

# 必要的权限：读写 release 内容
permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 打包源码为 zip（排除 .git、node_modules、generated-images 等）
      # 注意：清单需与仓库文件保持同步，新增模块（js/html/css/libs）后必须同步补充
      - name: Build source zip
        working-directory: ..
        run: |
          # 打包时排除不需要的目录和文件
          zip -r "${{ github.workspace }}/wenshengtu-${{ github.ref_name }}.zip" \
            "${{ github.workspace }}/.github" \
            "${{ github.workspace }}/.gitignore" \
            "${{ github.workspace }}/README.md" \
            "${{ github.workspace }}/app-config.js" \
            "${{ github.workspace }}/app-nav.js" \
            "${{ github.workspace }}/app-rail.css" \
            "${{ github.workspace }}/app-utils.js" \
            "${{ github.workspace }}/app.js" \
            "${{ github.workspace }}/article.css" \
            "${{ github.workspace }}/article.html" \
            "${{ github.workspace }}/article.js" \
            "${{ github.workspace }}/gallery.css" \
            "${{ github.workspace }}/gallery.html" \
            "${{ github.workspace }}/gallery.js" \
            "${{ github.workspace }}/help.html" \
            "${{ github.workspace }}/img2img.css" \
            "${{ github.workspace }}/img2img.html" \
            "${{ github.workspace }}/img2img.js" \
            "${{ github.workspace }}/index.html" \
            "${{ github.workspace }}/libs" \
            "${{ github.workspace }}/prompts.css" \
            "${{ github.workspace }}/prompts.html" \
            "${{ github.workspace }}/prompts.js" \
            "${{ github.workspace }}/server.js" \
            "${{ github.workspace }}/settings.html" \
            "${{ github.workspace }}/settings.js" \
            "${{ github.workspace }}/start.bat" \
            "${{ github.workspace }}/styles.css" \
            "${{ github.workspace }}/tests" \
            "${{ github.workspace }}/xhs.css" \
            "${{ github.workspace }}/xhs.html" \
            "${{ github.workspace }}/xhs.js" \
            -x "*.git/*" "generated-images/*" "node_modules/*"

      # 3. 创建 GitHub Release 并上传 zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 图生图长 · AI 创作台 ${{ github.ref_name }}

            > 纯本地运行的 AI 文字生图工具，开箱即用，支持多通道、多平台、多模板。

            ### 🚀 快速开始

            1. 双击 `start.bat` 启动，浏览器会自动打开 `http://127.0.0.1:3211/`
            2. 在「通道设置」中配置生图 API（Base URL / API Key / 模型名）
            3. 在「AI 助手模型」中配置一键优化用的文本模型（可选）
            4. 回到创作台，输入提示词，点击「开始创作」（快捷键 `Ctrl + Enter`）

            ### ✨ 核心功能

            - **文生图**：支持 1:1 / 3:4 / 4:3 / 9:16 / 16:9 / 21:9 多种比例，1K / 2K / 4K 三档清晰度
            - **批量生图**：多段提示词（空行分隔）一键顺序生成，支持生成中排队续输，可随时停止
            - **后台任务管理**：生成任务本地后台执行，切换页面不中断，支持断点续传与取消
            - **模板变量**：`{变量}` 模板 + 变量值表快速展开多条提示词
            - **随机生图**：模板组合系统（主体场景 + 媒介风格 + 镜头构图 + 光线氛围 + 质量收尾），洗牌袋算法保证周期内不重复
            - **一键优化提示词**：调用 AI 助手模型改写提示词，自动剥离推理模型的思考内容
            - **小红书图文笔记**：按笔记模式批量生成配图，独立风格库管理
            - **文章配图**：AI 按文章核心内容生成配图提示词，按篇幅智能推荐配图数量，支持导入 docx
            - **图生图工作台**：图片提取提示词 / 编辑 / 生成三种模式
            - **多生图通道管理**：支持任意多个 API 通道，同步 / 异步接口自动识别
            - **多 AI 助手平台**：DeepSeek / MiniMax / 其他服务多张独立卡片
            - **提示词库**：模糊搜索、收藏、分类、导入导出 JSON
            - **本地图片库**：自动打标签、标签搜索、按日期浏览、按比例筛选、批量管理
            - **轻量账号系统**：本地保存个性化配置（可选）

            ### 📦 本次更新（相对 V1.0.2）

            - **修复一键优化泄露思考内容**：推理模型返回的 `<think>...</think>` 思考过程不再混入提示词框，自动剥离仅保留正式回答
            - **小红书图文笔记模块**：话题生图、笔记模式多图生成、独立自定义风格库（导入/导出/编辑）
            - **文章配图模块**：粘贴文章或导入 docx，AI 提炼核心内容生成配图提示词，按文章篇幅智能推荐配图数量
            - **图生图工作台**：上传图片提取提示词、视觉理解编辑、以图生图三种模式
            - **后台任务系统**：生成任务由本地服务托管，切页不中断，支持排队、取消与自动重试（临时错误最多 2-3 次）
            - **全局导航侧栏**：所有页面统一侧边导航，图片库支持自动打标签与标签搜索
            - **随机生图升级**：结构化模板组合 + 洗牌袋算法，大幅降低重复率

            ### ⚙️ 兼容性

            - 操作系统：Windows 10 / 11
            - 运行时：Node.js（启动脚本会自动检查）
            - 浏览器：Chrome / Edge / Firefox 最新版

            ### 📥 下载与使用

            下载本 Release 下的源码压缩包 `wenshengtu-${{ github.ref_name }}.zip`，解压后双击 `start.bat` 即可启动。

            ---

            如有问题或建议，欢迎在仓库 Issues 中反馈。
          draft: false
          prerelease: false
          files: wenshengtu-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
