# GitHub Actions workflow: 自动创建 Release 并上传源码压缩包
# 触发条件：推送以 v 或 V 开头的 tag（如 v1.0.1、V1.0.1）

name: Auto Release

# 仅在推送 tag 时触发
on:
  push:
    tags:
      - 'v*'
      - 'V*'

# 必要的权限：读写 release 内容
permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 打包源码为 zip（排除 .git、node_modules、generated-images 等）
      - name: Build source zip
        working-directory: ..
        run: |
          # 打包时排除不需要的目录和文件
          zip -r "${{ github.workspace }}/wenshengtu-${{ github.ref_name }}.zip" \
            "${{ github.workspace }}/.github" \
            "${{ github.workspace }}/.gitignore" \
            "${{ github.workspace }}/README.md" \
            "${{ github.workspace }}/RELEASE_NOTES_*.md" \
            "${{ github.workspace }}/app-config.js" \
            "${{ github.workspace }}/app-utils.js" \
            "${{ github.workspace }}/app.js" \
            "${{ github.workspace }}/gallery.css" \
            "${{ github.workspace }}/gallery.html" \
            "${{ github.workspace }}/gallery.js" \
            "${{ github.workspace }}/help.html" \
            "${{ github.workspace }}/index.html" \
            "${{ github.workspace }}/prompts.css" \
            "${{ github.workspace }}/prompts.html" \
            "${{ github.workspace }}/prompts.js" \
            "${{ github.workspace }}/server.js" \
            "${{ github.workspace }}/settings.html" \
            "${{ github.workspace }}/settings.js" \
            "${{ github.workspace }}/start.bat" \
            "${{ github.workspace }}/styles.css" \
            "${{ github.workspace }}/tests" \
            -x "*.git/*" "generated-images/*" "node_modules/*"

      # 3. 创建 GitHub Release 并上传 zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 图生图长 · AI 创作台 ${{ github.ref_name }}

            > 纯本地运行的 AI 文字生图工具，开箱即用，支持多通道、多平台、多模板。

            ### 🚀 快速开始

            1. 双击 `start.bat` 启动，浏览器会自动打开 `http://127.0.0.1:3211/`
            2. 在「通道设置」中配置生图 API（Base URL / API Key / 模型名）
            3. 在「AI 助手模型」中配置一键优化用的文本模型（可选）
            4. 回到创作台，输入提示词，点击「开始创作」（快捷键 `Ctrl + Enter`）

            ### ✨ 核心功能

            - **文生图**：支持 1:1 / 3:4 / 4:3 / 9:16 / 16:9 / 21:9 多种比例，1K / 2K / 4K 三档清晰度
            - **批量生图**：多段提示词（空行分隔）一键顺序生成，可随时停止
            - **模板变量**：`{变量}` 模板 + 变量值表快速展开多条提示词
            - **随机生图**：内置 30 条精选示例提示词，一键随机填入找灵感
            - **一键优化提示词**：调用 AI 助手模型改写提示词
            - **多生图通道管理**：支持任意多个 API 通道，OpenAI Images 兼容 / Agnes Images 两种接口类型
            - **多 AI 助手平台**：DeepSeek / MiniMax / 其他服务三张独立卡片
            - **提示词库**：模糊搜索、收藏、导入导出 JSON
            - **本地图片库**：按日期浏览、按比例筛选、放大预览、单张下载、批量删除
            - **轻量账号系统**：本地保存个性化配置（可选）

            ### 📦 本次更新（相对 V1.0.0）

            - 同步项目最新源代码（V2.0.1 内部开发版）
            - 优化批量生图面板文案与交互
            - 更新 README 与帮助文档
            - 完善生图通道测试与诊断能力
            - 修复若干已知问题，提升整体稳定性

            ### ⚙️ 兼容性

            - 操作系统：Windows 10 / 11
            - 运行时：Node.js（启动脚本会自动检查）
            - 浏览器：Chrome / Edge / Firefox 最新版

            ### 📥 下载与使用

            下载本 Release 下的源码压缩包 `wenshengtu-${{ github.ref_name }}.zip`，解压后双击 `start.bat` 即可启动。

            ---

            如有问题或建议，欢迎在仓库 Issues 中反馈。
          draft: false
          prerelease: false
          files: wenshengtu-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true